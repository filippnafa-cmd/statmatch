<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StatMatch</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#121212;--card:#1c1c1e;--card2:#26262a;--line:#2e2e33;--acc:#FF5500;--red:#ff2a4d;--tx:#fff;--mut:#9a9aa3;--ok:#35d07f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.4 Rubik,system-ui,sans-serif;padding-bottom:80px}
h2{font-size:13px;color:var(--mut);font-weight:500;margin:20px 0 8px}
.wrap{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.av{width:56px;height:56px;border-radius:50%;background:var(--card2) center/cover;border:2px solid var(--acc);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.name{font-weight:800;font-size:19px}.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--red));border-radius:6px;transition:width .6s}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.st b{display:block;font-size:20px;font-weight:800}.st span{font-size:12px;color:var(--mut)}
.ladder{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.ladder div{flex:none;text-align:center;font-size:10px;color:var(--mut);opacity:.5}
.ladder .on{opacity:1;color:var(--tx)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:800 16px Rubik,sans-serif;color:#fff;background:var(--acc);cursor:pointer}
.btn:active{transform:scale(.98)}.btn.ghost{background:var(--card2)}.btn.big{padding:20px;font-size:22px;letter-spacing:.5px}
.btn:disabled{opacity:.4}
input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;color:#fff;font:500 15px Rubik,sans-serif;margin-bottom:10px}
input:focus,.opt:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--acc)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{background:var(--card2);border:2px solid transparent;border-radius:10px;padding:12px;color:#fff;font:500 14px Rubik,sans-serif;cursor:pointer;text-align:left}
.opt.sel{border-color:var(--acc);background:#2a1a12}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.icons .opt{font-size:22px;text-align:center;padding:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d0d0e;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 0 10px;font:500 12px Rubik,sans-serif;cursor:pointer}
nav button b{display:block;font-size:20px}nav .on{color:var(--acc)}
.slot{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.slot:last-child{border:0}
.mini{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;flex:none}
.logo{width:64px;height:64px;border-radius:16px;background:var(--card2);border:2px solid var(--acc);display:grid;place-items:center;font-size:32px;flex:none}
.tag{color:var(--acc);font-weight:800}
.search{text-align:center;padding:30px 14px}
.pulse{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;border:4px solid var(--acc);display:grid;place-items:center;font:800 28px Rubik,sans-serif;animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #ff550080}100%{box-shadow:0 0 0 30px #ff550000}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.win{color:var(--ok)}.lose{color:var(--red)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
const u=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{first_name:"Игрок",username:"player"};
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor("#121212");tg.setBackgroundColor("#121212");}catch(e){}}
const haptic=t=>{try{tg.HapticFeedback.impactOccurred(t||"light")}catch(e){}};

const LV=[[100,500],[501,750],[751,900],[901,1050],[1051,1200],[1201,1350],[1351,1530],[1531,1750],[1751,2000],[2001,9999]];
const lvOf=e=>{let l=1;LV.forEach((r,i)=>{if(e>=r[0])l=i+1});return l};
const lvCol=l=>l==1?"#9a9aa3":l<=3?"#35d07f":l<=7?"#ffc229":l<=9?"#FF5500":"#ff2a4d";
const badge=(l,s=44)=>`<svg width="${s}" height="${s}" viewBox="0 0 44 44" style="flex:none"><circle cx="22" cy="22" r="19" fill="#121212" stroke="${lvCol(l)}" stroke-width="4"/><circle cx="22" cy="22" r="19" fill="none" stroke="${lvCol(l)}" stroke-width="4" stroke-dasharray="${l*11.94} 120" transform="rotate(-90 22 22)" opacity=".25"/><text x="22" y="28.5" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="800" font-size="${l==10?17:20}" fill="#fff">${l}</text></svg>`;

let S={tab:"profile",elo:1180,matches:47,wins:27,kills:812,deaths:690,mode:"Рейтинг 5x5",map:"Sandstone",team:null,phase:"idle",found:0,sec:0,last:null};
try{const t=JSON.parse(localStorage.getItem("sm_team")||"null");if(t)S.team=t}catch(e){}
const MODES=["Рейтинг 5x5","Обычный 5x5"],MAPS=["Sandstone","Rust","Province","Zone 7","Hanami","Breeze"];
const ICONS=["🦅","🔥","💀","⚡","🐺","🎯","🛡️","🐉","☠️","🚀","👑","🦂"];
let draft={icon:"🔥"},timer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const init=(u.first_name||"?")[0].toUpperCase();
const me=()=>u.photo_url?`<div class="av" style="background-image:url('${esc(u.photo_url)}')"></div>`:`<div class="av">${esc(init)}</div>`;

function profile(){
  const l=lvOf(S.elo),r=LV[l-1],nx=l<10?LV[l][0]:null;
  const pct=l==10?100:Math.round((S.elo-r[0])/(nx-r[0])*100);
  const kd=(S.kills/S.deaths).toFixed(2),wr=Math.round(S.wins/S.matches*100);
  return `<div class="card"><div class="row">${me()}<div style="flex:1;min-width:0"><div class="name">${esc(u.first_name)}</div>
  <div class="mut">${u.username?"@"+esc(u.username):"Standoff 2"}${S.team?` · <span class="tag">[${esc(S.team.tag)}]</span>`:""}</div></div>${badge(l,56)}</div>
  <div class="row sp" style="margin-top:14px"><b style="font-size:30px;font-weight:800">${S.elo} <span style="font-size:14px;color:var(--acc)">ELO</span></b><span class="mut">Уровень ${l}</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="mut">${nx?`До уровня ${l+1}: ${nx-S.elo} ELO`:"Максимальный уровень"}</div></div>
  <h2>Статистика</h2><div class="grid3"><div class="st"><b>${kd}</b><span>K/D</span></div><div class="st"><b>${wr}%</b><span>Винрейт</span></div><div class="st"><b>${S.matches}</b><span>Матчей</span></div></div>
  ${S.last?`<h2>Последний матч</h2><div class="card row sp"><span>${esc(S.last.map)}</span><b class="${S.last.win?"win":"lose"}">${S.last.win?"Победа":"Поражение"} ${S.last.d>0?"+":""}${S.last.d}</b></div>`:""}
  <h2>Уровни</h2><div class="ladder">${LV.map((x,i)=>`<div class="${i+1==l?"on":""}">${badge(i+1,38)}${x[0]}${i==9?"+":""}</div>`).join("")}</div>`;
}

function play(){
  if(S.phase=="search")return `<div class="card search"><div class="pulse" id="pc">${S.found}/10</div><div class="name">Ищем матч</div><div class="mut">${esc(S.mode)} · ${esc(S.map)} · <span id="ps">${S.sec}</span> с</div><div style="height:16px"></div><button class="btn ghost" onclick="cancel()">Отменить</button></div>`;
  if(S.phase=="lobby"){const a=lobbyTeam(5,true),b=lobbyTeam(5,false);
    return `<div class="card"><div class="row sp"><b style="font-size:18px">Матч найден</b><span class="mut">${esc(S.map)}</span></div>
    <div class="teams" style="margin-top:12px"><div><div class="mut">Ваша команда</div>${a}</div><div><div class="mut">Соперники</div>${b}</div></div></div>
    <div style="height:12px"></div><button class="btn big" onclick="finish()">Начать матч</button><div style="height:8px"></div><button class="btn ghost" onclick="cancel()">Выйти из лобби</button>`;}
  return `<h2>Режим</h2><div class="opts">${MODES.map(m=>`<button class="opt ${m==S.mode?"sel":""}" onclick="S.mode='${m}';render()">${m}</button>`).join("")}</div>
  <h2>Карта</h2><div class="opts">${MAPS.map(m=>`<button class="opt ${m==S.map?"sel":""}" onclick="S.map='${m}';render()">${m}</button>`).join("")}</div>
  <div style="height:18px"></div><button class="btn big" onclick="startSearch()">Играть 5x5</button>`;
}
const fake=["Kira","Vlad","Neo","Sasha","Ghost","Rex","Mika","Zed","Alt","Yan"];
function lobbyTeam(n,mine){return Array.from({length:n},(_,i)=>{const nm=mine&&i==0?u.first_name:fake[(mine?i:i+5)%10];const lv=mine&&i==0?lvOf(S.elo):Math.max(1,Math.min(10,lvOf(S.elo)+((i*3)%5)-2));
  return `<div class="slot">${badge(lv,30)}<span>${esc(nm)}</span></div>`}).join("")}
function startSearch(){haptic();S.phase="search";S.found=0;S.sec=0;render();
  timer=setInterval(()=>{S.sec++;if(S.found<10&&Math.random()<.6)S.found++;
    const a=$("pc"),b=$("ps");if(a)a.textContent=S.found+"/10";if(b)b.textContent=S.sec;
    if(S.found>=10){clearInterval(timer);S.phase="lobby";haptic("medium");render()}},700)}
function cancel(){clearInterval(timer);S.phase="idle";render()}
function finish(){const win=Math.random()<.55,d=win?20+Math.floor(Math.random()*6):-(18+Math.floor(Math.random()*6));
  const k=8+Math.floor(Math.random()*18),de=8+Math.floor(Math.random()*14);
  S.elo=Math.max(100,S.elo+d);S.matches++;if(win)S.wins++;S.kills+=k;S.deaths+=de;S.last={win,d,map:S.map};S.phase="idle";S.tab="profile";haptic(win?"heavy":"light");render()}

function teamView(){
  if(!S.team)return `<div class="card"><div class="name" style="margin-bottom:12px">Создать команду</div>
  <input id="tn" maxlength="20" placeholder="Название команды"><input id="tt" maxlength="4" placeholder="Тег (до 4 символов)" style="text-transform:uppercase">
  <div class="mut" style="margin-bottom:8px">Логотип</div><div class="icons">${ICONS.map(i=>`<button class="opt ${i==draft.icon?"sel":""}" onclick="draft.icon='${i}';keep();render()">${i}</button>`).join("")}</div>
  <button class="btn" onclick="mk()">Создать команду</button></div>`;
  const t=S.team,link=`https://t.me/StatMatchBot/app?startapp=team_${encodeURIComponent(t.tag)}`;
  const slots=Array.from({length:5},(_,i)=>i==0?`<div class="slot">${badge(lvOf(S.elo),30)}<span style="flex:1">${esc(u.first_name)}</span><span class="mut">Капитан</span></div>`:`<div class="slot"><div class="mini">+</div><span class="mut">Свободное место</span></div>`).join("");
  return `<div class="card row"><div class="logo">${t.icon}</div><div><div class="name">${esc(t.name)}</div><div class="tag">[${esc(t.tag)}]</div></div></div>
  <h2>Состав</h2><div class="card" style="padding:4px 14px">${slots}</div>
  <h2>Пригласить друзей</h2><div class="card"><div class="mut" style="word-break:break-all;margin-bottom:10px">${esc(link)}</div>
  <div class="row"><button class="btn" onclick="share('${link}')">Поделиться</button><button class="btn ghost" id="cp" onclick="copy('${link}')">Копировать</button></div></div>
  <div style="height:12px"></div><button class="btn ghost" onclick="del()">Удалить команду</button>`;
}
function keep(){const a=$("tn"),b=$("tt");if(a)draft.name=a.value;if(b)draft.tag=b.value}
function mk(){keep();const n=(draft.name||"").trim(),t=(draft.tag||"").trim().toUpperCase();
  if(n.length<2||t.length<2){haptic("medium");alert("Введите название (от 2 символов) и тег (от 2 символов)");return}
  S.team={name:n,tag:t,icon:draft.icon};try{localStorage.setItem("sm_team",JSON.stringify(S.team))}catch(e){}haptic("medium");render()}
function del(){S.team=null;draft={icon:"🔥"};try{localStorage.removeItem("sm_team")}catch(e){}render()}
function share(l){const url="https://t.me/share/url?url="+encodeURIComponent(l)+"&text="+encodeURIComponent("Вступай в мою команду в StatMatch!");
  if(tg&&tg.openTelegramLink)tg.openTelegramLink(url);else window.open(url,"_blank")}
function copy(l){const done=()=>{const b=$("cp");if(b)b.textContent="Скопировано"};
  try{navigator.clipboard.writeText(l).then(done,done)}catch(e){done()}}

function render(){
  $("app").innerHTML=S.tab=="profile"?profile():S.tab=="play"?play():teamView();
  $("nav").innerHTML=[["profile","👤","Профиль"],["play","🎮","Играть"],["team","🛡️","Команда"]].map(t=>`<button class="${S.tab==t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");
}
function go(t){keep();S.tab=t;haptic();render();window.scrollTo(0,0)}
render();
</script>
</body>
</html>
